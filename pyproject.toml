[project]
name = "clodick"
version = "0.1.0"
description = "Лёгкий десктоп-компаньон: ежедневные напоминания про спорт, учёбу и язык"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gspread>=6.2.1",
    "psutil>=7.2.2",
    "pyside6-essentials>=6.11.2",
]

[project.scripts]
clodick = "clodick.app:main"

[project.gui-scripts]
clodick-gui = "clodick.app:gui_main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clodick"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
