# Персонаж cloDICK. Формат описан в docs/CHARACTERS.md.
id = "raccoon"
name = "Raccoon"
author = "cloDICK"
description = "A grey masked raccoon who likes to stroll along the taskbar."
# Размер кадра в пикселях арта: ширина, высота.
size = [22, 18]

# Символ в кадре → цвет. Точка — всегда прозрачная.
[palette]
K = "#26262e"  # контур
G = "#8b909b"  # серая шерсть
g = "#5d626d"  # тёмная шерсть, лапы
W = "#ecebef"  # белая шерсть
M = "#16161b"  # маска и полоски хвоста
E = "#ffffff"  # блик в глазу
P = "#d98c9c"  # розовое в ушах
Z = "#9fc3ff"  # буквы сна

# Цвета для темы Терракота.
[variants.claude]
K = "#2a2926"
G = "#a39e91"
g = "#78736a"
W = "#faf9f5"
M = "#141413"
P = "#d97757"
Z = "#d97757"

# Цвета для темы Рыжий енот.
[variants.claude_orange]
